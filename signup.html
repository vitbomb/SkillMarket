<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Skill Market</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" type="imagex/png" href="imagens/download-_1_.ico">
</head>

<body>
       <header>
    <div class="engrenagem-header">
        <img src="imagens/engrenagem.png" alt="" class="imagem1-header">
    </div>

    <!-- Barra de busca embutida no cabeçalho -->
    <div class="busca-header">
        <input type="text" id="campoBuscaHeader" placeholder="Buscar profissionais...">
        <button id="btnBuscarHeader">Buscar</button>
    </div>

    <div class="header-geral">
        <ul class="itens-header">
            <li><a href="index.html">Home</a></li>
            <li><a href="sobrenos.html">Sobre Nós</a></li>
            <li><a href="help.html">Help?</a></li>
            <!-- IDs adicionados para controle dinâmico -->
            <li id="menu-signin"><a href="signin.html">Sign In</a></li>
            <li id="menu-signup"><a href="signup.html">Sign Up</a></li>
        </ul>

        <!-- ID adicionado para controle dinâmico do perfil -->
        <div class="perfil-header" id="menu-perfil" style="display: none;">
            <img src="imagens/julia.jpg" alt="" class="imagem2-header">
            <div class="submenu-perfil">
                <a href="perfil.html" id="linkMeuPerfilMenu">Meu Perfil</a>
                    <a href="perfil-profissional.html">Editar Perfil</a>
                    <a href="#" id="btnSair">Sair da Conta</a>
            </div>
        </div>
    </div>
</header>

    <main class="container-cadastro">
        <form id="formCadastro" class="cadastro">
            <h1>Criar Conta</h1>

            <input type="text" id="nome" placeholder="Nome...">
            <input type="email" id="email" placeholder="Email...">
            <input type="password" id="senha" placeholder="Senha...">
            <input type="password" id="confirmarSenha" placeholder="Confirmar senha...">

            <p id="mensagemErro" class="mensagem-erro"></p>

            <div class="botoes-cadastro">
                <a href="signin.html"><button type="button" id="btnJaPossuo">Já possuo</button></a>
                <button type="submit" id="btnCadastrar">Fazer meu cadastro!</button>
            </div>
        </form>
    </main>

    <script src="script.js"></script>
</body>
